name: Frontend CI/CD

# =================================================================
# Trigger Configuration
# =================================================================
on:
  push:
    branches:
      - main
      - development
      - 'release/**'
    paths:
      - 'b2b-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'b2b-frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =================================================================
# Environment Variables
# =================================================================
env:
  NODE_VERSION: '20.x'
  WORKING_DIRECTORY: './b2b-frontend'

# =================================================================
# Jobs
# =================================================================
jobs:
  # =================================================================
  # Job 1: Code Quality & Linting
  # =================================================================
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Run ESLint
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "⚠️ ESLint not configured, skipping..."
          fi
        shell: bash
        continue-on-error: true

  # =================================================================
  # Job 2: Build Validation
  # =================================================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit

      - name: 🏗️ Build production bundle
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build
        env:
          # Use placeholder values for CI build
          VITE_API_URL: https://api.example.com
          VITE_SOCKET_URL: https://api.example.com
          VITE_RAZORPAY_KEY_ID: rzp_test_placeholder

      - name: 📊 Analyze bundle size
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "📦 Build artifacts:"
          du -sh dist/
          echo ""
          echo "📁 Detailed breakdown:"
          du -h dist/ | sort -h | tail -20

      - name: ✅ Verify build output
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.WORKING_DIRECTORY }}/dist
          retention-days: 7

  # =================================================================
  # Job 3: Unit Tests (if configured)
  # =================================================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit

      - name: 🧪 Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if grep -q '"test"' package.json; then
            npm test -- --passWithNoTests
          else
            echo "⚠️ No tests configured, skipping..."
          fi
        shell: bash
        continue-on-error: true

  # =================================================================
  # Job 4: Type Checking (if TypeScript)
  # =================================================================
  type-check:
    name: 🔍 Type Check
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Check TypeScript types
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          else
            echo "⚠️ TypeScript not configured, skipping..."
          fi
        shell: bash
        continue-on-error: true

  # =================================================================
  # Job 5: Docker Build Validation
  # =================================================================
  docker-build:
    name: 🐳 Docker Build Validation
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: false
          tags: b2b-frontend:ci-test
          build-args: |
            VITE_API_URL=https://api.example.com
            VITE_SOCKET_URL=https://api.example.com
            VITE_RAZORPAY_KEY_ID=rzp_test_placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Test Docker image
        run: |
          docker run --rm --name test-nginx -d -p 8080:80 b2b-frontend:ci-test
          sleep 5
          
          # Test health endpoint
          if curl -f http://localhost:8080/health; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            docker logs test-nginx
            exit 1
          fi
          
          # Test main page
          if curl -f http://localhost:8080/ | grep -q "<!DOCTYPE html>"; then
            echo "✅ Main page accessible"
          else
            echo "❌ Main page not accessible"
            docker logs test-nginx
            exit 1
          fi
          
          docker stop test-nginx

  # =================================================================
  # Job 6: Security Audit
  # =================================================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔒 Run npm audit
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  # =================================================================
  # Job 7: Vercel Deployment Preview (Optional)
  # =================================================================
  vercel-preview:
    name: 🚀 Vercel Preview Check
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const message = `## 🚀 Vercel Deployment Preview
            
            ✅ Build successful! 
            
            Vercel will automatically deploy this PR.
            Check the Vercel bot comment below for the preview URL.
            
            ### Build Details
            - **Commit**: ${context.sha.substring(0, 7)}
            - **Branch**: ${context.ref.replace('refs/heads/', '')}
            - **Workflow**: [View Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  # =================================================================
  # Job 8: Summary
  # =================================================================
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [lint, build, test, type-check, docker-build, security-audit]
    if: success()
    
    steps:
      - name: ✅ All checks passed
        run: |
          echo "🎉 All CI checks passed successfully!"
          echo "✅ Linting"
          echo "✅ Build"
          echo "✅ Tests"
          echo "✅ Type Check"
          echo "✅ Docker Build"
          echo "✅ Security Audit"
