name: Full Stack CI/CD

# =================================================================
# Trigger on any change to the monorepo
# =================================================================
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =================================================================
# Jobs
# =================================================================
jobs:
  # =================================================================
  # Job 1: Check which parts of the stack changed
  # =================================================================
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'b2b-backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/fullstack-ci.yml'
            frontend:
              - 'b2b-frontend/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/fullstack-ci.yml'
            docker:
              - '**/Dockerfile'
              - 'docker-compose.yml'
              - '**/.dockerignore'

  # =================================================================
  # Job 2: Backend CI (conditional)
  # =================================================================
  backend-ci:
    name: 🔙 Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  # =================================================================
  # Job 3: Frontend CI (conditional)
  # =================================================================
  frontend-ci:
    name: 🎨 Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  # =================================================================
  # Job 4: Docker Compose Integration Test
  # =================================================================
  docker-compose-test:
    name: 🐳 Docker Compose Integration
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Create .env file
        run: |
          cat > b2b-backend/.env << EOF
          NODE_ENV=production
          PORT=5000
          MONGO_URI=mongodb://mongo:27017/test
          JWT_SECRET=test_jwt_secret_for_ci_minimum_32_characters_long_secure
          RAZORPAY_KEY_ID=test_key
          RAZORPAY_KEY_SECRET=test_secret
          RAZORPAY_WEBHOOK_SECRET=test_webhook
          REDIS_HOST=redis
          REDIS_PORT=6379
          FRONTEND_URL=http://localhost:3000
          EOF

      - name: 🚀 Start services with docker-compose
        run: |
          docker-compose up -d
          sleep 30

      - name: 🔍 Check service health
        run: |
          # Check MongoDB
          docker-compose exec -T mongo mongosh --eval "db.runCommand('ping')" || exit 1
          
          # Check Redis
          docker-compose exec -T redis redis-cli ping || exit 1
          
          # Check Backend
          max_attempts=10
          attempt=0
          until curl -f http://localhost:5000/health || [ $attempt -eq $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Waiting for backend..."
            sleep 5
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Backend health check failed"
            docker-compose logs backend
            exit 1
          fi
          
          # Check Frontend
          curl -f http://localhost:3000/health || exit 1

      - name: 📊 Show logs on failure
        if: failure()
        run: |
          docker-compose logs

      - name: 🧹 Cleanup
        if: always()
        run: |
          docker-compose down -v

  # =================================================================
  # Job 5: Full Stack Summary
  # =================================================================
  ci-complete:
    name: ✅ Full Stack CI Complete
    runs-on: ubuntu-latest
    needs: [changes, backend-ci, frontend-ci, docker-compose-test]
    if: always()
    
    steps:
      - name: ✅ Check all jobs
        run: |
          echo "🔍 Changes Detection: ${{ needs.changes.result }}"
          echo "🔙 Backend CI: ${{ needs.backend-ci.result || 'skipped' }}"
          echo "🎨 Frontend CI: ${{ needs.frontend-ci.result || 'skipped' }}"
          echo "🐳 Docker Compose: ${{ needs.docker-compose-test.result || 'skipped' }}"
          
          if [[ "${{ needs.backend-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-compose-test.result }}" == "failure" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          
          echo "✅ All CI checks passed or skipped appropriately!"
