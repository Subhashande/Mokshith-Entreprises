name: Backend CI/CD

# =================================================================
# Trigger Configuration
# =================================================================
on:
  push:
    branches:
      - main
      - development
      - 'release/**'
    paths:
      - 'b2b-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'b2b-backend/**'
      - '.github/workflows/backend-ci.yml'

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =================================================================
# Environment Variables
# =================================================================
env:
  NODE_VERSION: '20.x'
  WORKING_DIRECTORY: './b2b-backend'

# =================================================================
# Jobs
# =================================================================
jobs:
  # =================================================================
  # Job 1: Code Quality & Linting
  # =================================================================
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Run ESLint
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint || echo "ESLint not configured, skipping..."
        continue-on-error: true

      - name: 🎨 Check code formatting (Prettier)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f "package.json" ] && grep -q '"format"' package.json; then
            npm run format -- --check
          else
            echo "Prettier not configured, skipping..."
          fi
        shell: bash
        continue-on-error: true

  # =================================================================
  # Job 2: Unit Tests
  # =================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit

      - name: 🧪 Run unit tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm test -- tests/unit --coverage --maxWorkers=2
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test
          JWT_SECRET: test_jwt_secret_for_ci_minimum_32_chars
          RAZORPAY_KEY_ID: test_key_id
          RAZORPAY_KEY_SECRET: test_key_secret

      - name: 📊 Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: ${{ env.WORKING_DIRECTORY }}/coverage
          retention-days: 7

  # =================================================================
  # Job 3: Integration Tests
  # =================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit

      - name: ⏳ Wait for services
        run: |
          echo "Waiting for MongoDB..."
          timeout 30 bash -c 'until nc -z localhost 27017; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      - name: 🔗 Run integration tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm test -- tests/integration --coverage --maxWorkers=2
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test-integration
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_for_ci_minimum_32_chars
          RAZORPAY_KEY_ID: test_key_id
          RAZORPAY_KEY_SECRET: test_key_secret

      - name: 📊 Upload integration test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-coverage
          path: ${{ env.WORKING_DIRECTORY }}/coverage
          retention-days: 7

  # =================================================================
  # Job 4: E2E Tests
  # =================================================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit

      - name: ⏳ Wait for services
        run: |
          echo "Waiting for MongoDB..."
          timeout 30 bash -c 'until nc -z localhost 27017; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      - name: 🎭 Run E2E tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm test -- tests/e2e --coverage --maxWorkers=2 --runInBand
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test-e2e
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_for_ci_minimum_32_chars
          RAZORPAY_KEY_ID: test_key_id
          RAZORPAY_KEY_SECRET: test_key_secret
          PORT: 5001

      - name: 📊 Upload E2E test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-coverage
          path: ${{ env.WORKING_DIRECTORY }}/coverage
          retention-days: 7

  # =================================================================
  # Job 5: Build & Startup Validation
  # =================================================================
  build-validation:
    name: 🏗️ Build & Startup Validation
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --prefer-offline --no-audit --production

      - name: ⏳ Wait for services
        run: |
          timeout 30 bash -c 'until nc -z localhost 27017; do sleep 1; done'
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      - name: 🚀 Validate server startup
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          timeout 30 node server.js &
          SERVER_PID=$!
          sleep 15
          
          # Check if server is running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "✅ Server started successfully"
            
            # Try to hit health endpoint
            curl -f http://localhost:5000/health || echo "⚠️ Health endpoint not responding yet"
            
            kill $SERVER_PID
            exit 0
          else
            echo "❌ Server failed to start"
            exit 1
          fi
        env:
          NODE_ENV: production
          MONGO_URI: mongodb://localhost:27017/startup-test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_for_startup_validation_minimum_32_characters
          RAZORPAY_KEY_ID: test_key_id
          RAZORPAY_KEY_SECRET: test_key_secret
          PORT: 5000

  # =================================================================
  # Job 6: Docker Build Validation (Optional)
  # =================================================================
  docker-build:
    name: 🐳 Docker Build Validation
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: false
          tags: b2b-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Test Docker image
        run: |
          docker run --rm b2b-backend:ci-test node --version

  # =================================================================
  # Job 7: Security Audit
  # =================================================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔒 Run npm audit
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  # =================================================================
  # Job 8: Summary
  # =================================================================
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, e2e-tests, build-validation, docker-build, security-audit]
    if: success()
    
    steps:
      - name: ✅ All checks passed
        run: |
          echo "🎉 All CI checks passed successfully!"
          echo "✅ Linting"
          echo "✅ Unit Tests"
          echo "✅ Integration Tests"
          echo "✅ E2E Tests"
          echo "✅ Build Validation"
          echo "✅ Docker Build"
          echo "✅ Security Audit"
