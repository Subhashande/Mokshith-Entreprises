# =================================================================
# Docker Compose for B2B E-Commerce Platform - Local Development
# =================================================================
# This setup provides:
# - MongoDB database
# - Redis cache & queue
# - Backend API server
# - Frontend development server
# =================================================================

services:
  # =================================================================
  # MongoDB Database
  # =================================================================
  mongo:
    image: mongo:7.0
    container_name: b2b-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mokshith-entreprises
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - b2b-network

  # =================================================================
  # Redis Cache & Queue
  # =================================================================
  redis:
    image: redis:7.2-alpine
    container_name: b2b-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - b2b-network

  # =================================================================
  # Backend API Server
  # =================================================================
  backend:
    build:
      context: ./b2b-backend
      dockerfile: Dockerfile
    container_name: b2b-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Server
      PORT: 5000
      NODE_ENV: development
      
      # Database - Using Docker service name
      MONGO_URI: mongodb://mongo:27017/mokshith-entreprises
      
      # Redis - Using Docker service name
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # JWT - Use your actual secrets from .env
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_strong_random_secret_minimum_32_characters_long}
      JWT_EXPIRE: ${JWT_EXPIRE:-1d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_to_another_strong_random_secret_for_refresh_tokens}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      
      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      
      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@mokshith-entreprises.com}
      
      # Frontend URL for CORS
      FRONTEND_URL: http://localhost:3000
      
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount code for hot-reload during development
      - ./b2b-backend:/app
      - /app/node_modules
      # Persist logs
      - backend-logs:/app/logs
      # Persist uploads (use cloud storage in production)
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - b2b-network

  # =================================================================
  # Frontend Development Server
  # =================================================================
  frontend:
    build:
      context: ./b2b-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_SOCKET_URL: http://localhost:5000
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    container_name: b2b-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - b2b-network

# =================================================================
# Volumes for Data Persistence
# =================================================================
volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  backend-logs:
    driver: local
  backend-uploads:
    driver: local

# =================================================================
# Network Configuration
# =================================================================
networks:
  b2b-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
